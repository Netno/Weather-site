name: Diagnos av live-sajten

# Tillfällig felsökning: hämtar manifest och historiksida från produktion
# för att avgöra om Vercel serverar en gammal deploy. Tas bort när klart.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta manifest och sidversion från produktion
        run: |
          echo "=== /data/manifest.json ==="
          curl -sS -D /tmp/h1 https://weather.rickmark.se/data/manifest.json || true
          echo; echo "--- headers ---"; cat /tmp/h1
          echo "=== /data/acurite/manifest.json ==="
          curl -sS https://weather.rickmark.se/data/acurite/manifest.json || true
          echo
          echo "=== /historik/ — vilken banner-text ligger ute? ==="
          curl -sS -D /tmp/h2 https://weather.rickmark.se/historik/ -o /tmp/page || true
          grep -o '~[0-9]*0 dygn per natt' /tmp/page || echo "(hittade ingen dygn-per-natt-text)"
          echo "--- headers ---"; cat /tmp/h2
